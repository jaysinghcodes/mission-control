<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="mc-avatar" data-state="idle" data-size="md" role="img" aria-label="Nox — QA" style="--avatar-accent:#56D364;--avatar-accent-deep:#1F7A37;--avatar-body:#2A2E36;--avatar-deep:#1B1F26;--avatar-line:#3A414B;--avatar-hi:#E6E9ED;--avatar-paper:#E7DFCE;--avatar-faint:#8A939E;--status-error:#F85149">
  <g class="bob">
    <!-- head -->
    <rect x="17" y="7" width="14" height="13.5" rx="3" fill="var(--avatar-body)"/>
    <rect x="19" y="9.8" width="10" height="1.6" rx="0.8" fill="var(--avatar-accent)" opacity="0.5"/>
    <!-- body -->
    <rect x="17.5" y="21.5" width="13" height="12.5" rx="3" fill="var(--avatar-body)"/>
    <!-- clipboard chest -->
    <rect x="20" y="23.2" width="8" height="9" rx="1.5" fill="var(--avatar-deep)"/>
    <rect x="20" y="23.2" width="8" height="9" rx="1.5" fill="none" stroke="var(--avatar-accent)" stroke-width="1.1"/>
    <rect x="21.8" y="25.6" width="4.4" height="0.9" rx="0.45" fill="var(--avatar-accent)" opacity="0.75"/>
    <rect x="21.8" y="28" width="3.4" height="0.9" rx="0.45" fill="var(--avatar-accent)" opacity="0.55"/>
    <rect x="21.8" y="30.4" width="2.4" height="0.9" rx="0.45" fill="var(--avatar-accent)" opacity="0.4"/>
    <rect x="23.4" y="21.6" width="1.2" height="2.8" rx="0.6" fill="var(--avatar-hi)"/>
    <!-- arms -->
    <rect x="13.4" y="22" width="3" height="7" rx="1.5" fill="var(--avatar-deep)"/>
    <rect x="31.6" y="22" width="3" height="7" rx="1.5" fill="var(--avatar-deep)"/>
    <!-- inspector loupe over right eye -->
    <circle cx="28" cy="12.6" r="4.6" fill="var(--avatar-deep)"/>
    <circle cx="28" cy="12.6" r="4.6" fill="none" stroke="var(--avatar-accent)" stroke-width="1.6"/>
    <path d="M26.2 10.4 A 3.4 3.4 0 0 1 29 9.2" stroke="var(--avatar-hi)" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- feet -->
    <rect x="19.5" y="34" width="9" height="2.2" rx="1.1" fill="var(--avatar-deep)"/>
    <g class="eyes">
      <circle cx="21" cy="12.6" r="1.5" fill="var(--avatar-hi)"/>
      <circle cx="27.4" cy="12.6" r="1.5" fill="var(--avatar-hi)"/>
    </g>
    <g class="eyes-error">
      <path d="M19.6 11.2 L22.4 14 M22.4 11.2 L19.6 14" stroke="var(--status-error)" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M26 11.2 L28.8 14 M28.8 11.2 L26 14" stroke="var(--status-error)" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g class="eyes-offline">
      <circle cx="21" cy="12.6" r="1.5" fill="var(--avatar-faint)"/>
      <circle cx="27.4" cy="12.6" r="1.5" fill="var(--avatar-faint)"/>
    </g>
    <g class="tool-active">
      <!-- pass stamp -->
      <path class="fx" d="M20.6 4.2 L23 6.6 L27.6 1.8" stroke="var(--avatar-accent)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- scan sweep across the lens -->
      <line class="fx fx-2" x1="24.9" y1="9.6" x2="30.9" y2="15.6" stroke="var(--avatar-hi)" stroke-width="1" opacity="0.5"/>
    </g>
    <g class="error-badge">
      <path d="M40.5 2 L44.5 9.5 L36.5 9.5 Z" fill="none" stroke="var(--status-error)" stroke-width="1.4" stroke-linejoin="round"/>
      <line x1="40.5" y1="4.6" x2="40.5" y2="6.8" stroke="var(--status-error)" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="40.5" cy="8.2" r="0.8" fill="var(--status-error)"/>
    </g>
  </g>
</svg>
