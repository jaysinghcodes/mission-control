<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="mc-avatar" data-state="idle" data-size="md" role="img" aria-label="Sage — Research" style="--avatar-accent:#39C5CF;--avatar-accent-deep:#0E7C86;--avatar-body:#2A2E36;--avatar-deep:#1B1F26;--avatar-line:#3A414B;--avatar-hi:#E6E9ED;--avatar-paper:#E7DFCE;--avatar-faint:#8A939E;--status-error:#F85149">
  <g class="bob">
    <!-- satellite dish head -->
    <path d="M16 10.5 C 19.5 4.5, 28.5 4.5, 32 10.5 Z" fill="var(--avatar-deep)" stroke="var(--avatar-accent)" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M30.5 6.8 L33.2 2.9" stroke="var(--avatar-accent)" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="33.8" cy="2.3" r="1.4" fill="var(--avatar-accent)"/>
    <!-- mast -->
    <rect x="23.1" y="10.5" width="1.8" height="7" fill="var(--avatar-deep)"/>
    <!-- body -->
    <rect x="19" y="17.5" width="10" height="11" rx="3" fill="var(--avatar-body)"/>
    <!-- data panel -->
    <rect x="21.2" y="22" width="5.6" height="4.4" rx="1" fill="var(--avatar-deep)" stroke="var(--avatar-accent)" stroke-width="1"/>
    <rect x="22.3" y="23.3" width="3.2" height="0.8" rx="0.4" fill="var(--avatar-accent)" opacity="0.8"/>
    <rect x="22.3" y="24.6" width="2.2" height="0.8" rx="0.4" fill="var(--avatar-accent)" opacity="0.5"/>
    <!-- arms -->
    <rect x="14.6" y="18.5" width="2.8" height="6" rx="1.4" fill="var(--avatar-deep)"/>
    <rect x="30.6" y="18.5" width="2.8" height="6" rx="1.4" fill="var(--avatar-deep)"/>
    <!-- feet -->
    <rect x="20.5" y="28.5" width="7" height="2.2" rx="1.1" fill="var(--avatar-deep)"/>
    <!-- eyes on the torso -->
    <g class="eyes">
      <circle cx="22.3" cy="19.6" r="1.4" fill="var(--avatar-hi)"/>
      <circle cx="25.7" cy="19.6" r="1.4" fill="var(--avatar-hi)"/>
    </g>
    <g class="eyes-error">
      <path d="M20.9 18.2 L23.7 21 M23.7 18.2 L20.9 21" stroke="var(--status-error)" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M24.3 18.2 L27.1 21 M27.1 18.2 L24.3 21" stroke="var(--status-error)" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g class="eyes-offline">
      <circle cx="22.3" cy="19.6" r="1.4" fill="var(--avatar-faint)"/>
      <circle cx="25.7" cy="19.6" r="1.4" fill="var(--avatar-faint)"/>
    </g>
    <g class="tool-active">
      <!-- incoming signal arcs -->
      <path class="fx" d="M10.5 10.2 A 5.6 5.6 0 0 1 14.8 5.4" stroke="var(--avatar-accent)" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.55"/>
      <path class="fx fx-2" d="M7.8 13.8 A 9 9 0 0 1 14.6 6.4" stroke="var(--avatar-accent)" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.3"/>
      <circle class="fx" cx="13" cy="3.4" r="0.9" fill="var(--avatar-accent)"/>
    </g>
    <g class="error-badge">
      <path d="M40.5 2 L44.5 9.5 L36.5 9.5 Z" fill="none" stroke="var(--status-error)" stroke-width="1.4" stroke-linejoin="round"/>
      <line x1="40.5" y1="4.6" x2="40.5" y2="6.8" stroke="var(--status-error)" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="40.5" cy="8.2" r="0.8" fill="var(--status-error)"/>
    </g>
  </g>
</svg>
