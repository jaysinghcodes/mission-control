<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="mc-avatar" data-state="idle" data-size="md" role="img" aria-label="Scribe — Summary" style="--avatar-accent:#E8833A;--avatar-accent-deep:#9A4A0B;--avatar-body:#2A2E36;--avatar-deep:#1B1F26;--avatar-line:#3A414B;--avatar-hi:#E6E9ED;--avatar-paper:#E7DFCE;--avatar-faint:#8A939E;--status-error:#F85149">
  <g class="bob">
    <!-- book-spine head -->
    <rect x="19" y="6" width="10" height="16.5" rx="2.5" fill="var(--avatar-body)"/>
    <rect x="19" y="6" width="2.8" height="16.5" rx="1.4" fill="var(--avatar-accent)"/>
    <line x1="23.2" y1="13.6" x2="23.2" y2="19.4" stroke="var(--avatar-line)" stroke-width="0.8" opacity="0.6"/>
    <line x1="24.8" y1="13.6" x2="24.8" y2="19.4" stroke="var(--avatar-line)" stroke-width="0.8" opacity="0.35"/>
    <line x1="26.4" y1="13.6" x2="26.4" y2="19.4" stroke="var(--avatar-line)" stroke-width="0.8" opacity="0.2"/>
    <!-- body -->
    <rect x="17.5" y="21" width="13" height="13" rx="3" fill="var(--avatar-body)"/>
    <!-- parchment chest -->
    <rect x="20.2" y="23.5" width="7.6" height="9" rx="1.4" fill="var(--avatar-paper)"/>
    <rect x="20.2" y="23.5" width="7.6" height="9" rx="1.4" fill="none" stroke="var(--avatar-accent)" stroke-width="1.1"/>
    <path d="M22.5 26.2 h3.4 M22.5 28.4 h2.8 M22.5 30.6 h2" stroke="var(--avatar-line)" stroke-width="1" stroke-linecap="round"/>
    <!-- left arm -->
    <rect x="13" y="21" width="3" height="6.5" rx="1.5" fill="var(--avatar-deep)"/>
    <!-- quill arm (right) -->
    <rect x="31.2" y="21" width="3" height="6" rx="1.5" fill="var(--avatar-deep)"/>
    <path d="M33.4 26.2 C 35.2 22.8, 37.8 20.6, 40 17.6" stroke="var(--avatar-accent)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M35.4 23.4 L37.2 22.6 M37 21.4 L38.6 20.6" stroke="var(--avatar-accent)" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <path d="M32.7 26.6 L33.9 26.8 L33.1 28.4 Z" fill="var(--avatar-line)"/>
    <!-- feet -->
    <rect x="19.5" y="34" width="9" height="2.2" rx="1.1" fill="var(--avatar-deep)"/>
    <g class="eyes">
      <circle cx="22.6" cy="10.6" r="1.4" fill="var(--avatar-hi)"/>
      <circle cx="25.4" cy="10.6" r="1.4" fill="var(--avatar-hi)"/>
    </g>
    <g class="eyes-error">
      <path d="M21.2 9.2 L24 12 M24 9.2 L21.2 12" stroke="var(--status-error)" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M24 9.2 L26.8 12 M26.8 9.2 L24 12" stroke="var(--status-error)" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g class="eyes-offline">
      <circle cx="22.6" cy="10.6" r="1.4" fill="var(--avatar-faint)"/>
      <circle cx="25.4" cy="10.6" r="1.4" fill="var(--avatar-faint)"/>
    </g>
    <g class="tool-active">
      <!-- writing line -->
      <path class="ink" d="M33.6 27.4 C 31.8 30.4, 32.4 33.4, 30.6 36.4" stroke="var(--avatar-accent)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <circle class="fx" cx="30.4" cy="36.6" r="0.9" fill="var(--avatar-accent)"/>
    </g>
    <g class="error-badge">
      <path d="M40.5 2 L44.5 9.5 L36.5 9.5 Z" fill="none" stroke="var(--status-error)" stroke-width="1.4" stroke-linejoin="round"/>
      <line x1="40.5" y1="4.6" x2="40.5" y2="6.8" stroke="var(--status-error)" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="40.5" cy="8.2" r="0.8" fill="var(--status-error)"/>
    </g>
  </g>
</svg>
