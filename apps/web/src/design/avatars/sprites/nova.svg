<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="mc-avatar" data-state="idle" data-size="md" role="img" aria-label="Nova — Development" style="--avatar-accent:#58A6FF;--avatar-accent-deep:#1D4ED8;--avatar-body:#2A2E36;--avatar-deep:#1B1F26;--avatar-line:#3A414B;--avatar-hi:#E6E9ED;--avatar-paper:#E7DFCE;--avatar-faint:#8A939E;--status-error:#F85149">
  <g class="bob">
    <!-- exhaust pipe -->
    <rect x="20.6" y="1.8" width="2.8" height="4.6" rx="1" fill="var(--avatar-deep)"/>
    <!-- welding mask -->
    <rect x="16.5" y="7.5" width="15" height="13" rx="3.5" fill="var(--avatar-body)"/>
    <rect x="19" y="11" width="10" height="2.8" rx="1.4" fill="var(--avatar-accent)"/>
    <!-- body -->
    <rect x="17.5" y="21.5" width="13" height="13" rx="3" fill="var(--avatar-body)"/>
    <!-- bolt chest -->
    <path d="M24 27.8 L26.8 29.2 L26.8 31.9 L24 33.3 L21.2 31.9 L21.2 29.2 Z" fill="var(--avatar-accent-deep)"/>
    <circle cx="24" cy="30.55" r="1.1" fill="var(--avatar-accent)"/>
    <!-- left arm -->
    <rect x="13" y="22" width="3.2" height="6.5" rx="1.6" fill="var(--avatar-deep)"/>
    <!-- torch arm (right) -->
    <rect x="31.3" y="22" width="3.2" height="6" rx="1.6" fill="var(--avatar-deep)"/>
    <rect x="30.9" y="27.6" width="4" height="2.8" rx="1" fill="var(--avatar-accent)"/>
    <!-- feet -->
    <rect x="19.5" y="34.5" width="9" height="2.2" rx="1.1" fill="var(--avatar-deep)"/>
    <g class="eyes">
      <circle cx="21" cy="12.6" r="1.5" fill="var(--avatar-hi)"/>
      <circle cx="27" cy="12.6" r="1.5" fill="var(--avatar-hi)"/>
    </g>
    <g class="eyes-error">
      <path d="M19.6 11.2 L22.4 14 M22.4 11.2 L19.6 14" stroke="var(--status-error)" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M25.6 11.2 L28.4 14 M28.4 11.2 L25.6 14" stroke="var(--status-error)" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g class="eyes-offline">
      <circle cx="21" cy="12.6" r="1.5" fill="var(--avatar-faint)"/>
      <circle cx="27" cy="12.6" r="1.5" fill="var(--avatar-faint)"/>
    </g>
    <g class="tool-active">
      <!-- weld flame -->
      <path class="fx" d="M32.9 23.6 C34.6 25.8 34.6 28 32.9 29.1 C31.2 28 31.2 25.8 32.9 23.6 Z" fill="var(--avatar-accent)" opacity="0.9"/>
      <circle class="fx" cx="35.4" cy="25.4" r="0.8" fill="var(--avatar-accent)"/>
      <circle class="fx fx-2" cx="36" cy="22.4" r="0.6" fill="var(--avatar-accent)"/>
      <circle class="fx fx-2" cx="30.4" cy="24.2" r="0.6" fill="var(--avatar-hi)"/>
    </g>
    <g class="error-badge">
      <path d="M40.5 2 L44.5 9.5 L36.5 9.5 Z" fill="none" stroke="var(--status-error)" stroke-width="1.4" stroke-linejoin="round"/>
      <line x1="40.5" y1="4.6" x2="40.5" y2="6.8" stroke="var(--status-error)" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="40.5" cy="8.2" r="0.8" fill="var(--status-error)"/>
    </g>
  </g>
</svg>
