<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="mc-avatar" data-state="idle" data-size="md" role="img" aria-label="Pixel — Design" style="--avatar-accent:#F778BA;--avatar-accent-deep:#B33E7E;--avatar-body:#2A2E36;--avatar-deep:#1B1F26;--avatar-line:#3A414B;--avatar-hi:#E6E9ED;--avatar-paper:#E7DFCE;--avatar-faint:#8A939E;--status-error:#F85149">
  <g class="bob">
    <!-- beret -->
    <path d="M17.5 7.8 C 17 4.4, 20.5 2.6, 24 2.6 C 27.5 2.6, 31 4.4, 30.5 7.8 Z" fill="var(--avatar-accent)"/>
    <line x1="24" y1="2.6" x2="24" y2="1.2" stroke="var(--avatar-accent)" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="24" cy="0.8" r="0.9" fill="var(--avatar-accent)"/>
    <!-- head -->
    <rect x="17" y="7.5" width="14" height="13" rx="3.5" fill="var(--avatar-body)"/>
    <!-- body -->
    <rect x="17.5" y="21.5" width="13" height="12.5" rx="3" fill="var(--avatar-body)"/>
    <!-- palette chest -->
    <circle cx="24" cy="30" r="3.7" fill="var(--avatar-deep)"/>
    <circle cx="24" cy="30" r="3.7" fill="none" stroke="var(--avatar-accent)" stroke-width="1.2"/>
    <circle cx="22.5" cy="29" r="0.8" fill="var(--avatar-accent)"/>
    <circle cx="25.5" cy="29" r="0.8" fill="var(--avatar-hi)"/>
    <circle cx="24" cy="31.6" r="0.8" fill="var(--avatar-line)"/>
    <!-- left arm -->
    <rect x="13.2" y="21.5" width="3" height="6.5" rx="1.5" fill="var(--avatar-deep)"/>
    <!-- paintbrush beside the head (behind the arm) -->
    <rect x="31.9" y="14.5" width="2" height="8.5" rx="1" fill="var(--avatar-accent)"/>
    <rect x="31.7" y="12.6" width="2.4" height="1.9" rx="0.6" fill="var(--avatar-line)"/>
    <path d="M31.7 12.6 L34.1 12.6 L32.9 8.8 Z" fill="var(--avatar-body)"/>
    <!-- right arm -->
    <rect x="31.2" y="21.5" width="3.2" height="6" rx="1.6" fill="var(--avatar-deep)"/>
    <!-- feet -->
    <rect x="19.5" y="34" width="9" height="2.2" rx="1.1" fill="var(--avatar-deep)"/>
    <!-- one big artist eye -->
    <g class="eyes">
      <circle cx="20.8" cy="12.6" r="1.5" fill="var(--avatar-hi)"/>
      <circle cx="26.6" cy="12.6" r="2.6" fill="var(--avatar-deep)"/>
      <circle cx="26.6" cy="12.6" r="2.6" fill="none" stroke="var(--avatar-accent)" stroke-width="1.2"/>
      <circle cx="25.7" cy="11.4" r="0.9" fill="var(--avatar-hi)"/>
    </g>
    <g class="eyes-error">
      <path d="M19.4 11.2 L22.2 14 M22.2 11.2 L19.4 14" stroke="var(--status-error)" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M25.4 11.4 L27.8 13.8 M27.8 11.4 L25.4 13.8" stroke="var(--status-error)" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g class="eyes-offline">
      <circle cx="20.8" cy="12.6" r="1.5" fill="var(--avatar-faint)"/>
      <circle cx="26.6" cy="12.6" r="2.2" fill="var(--avatar-faint)" opacity="0.6"/>
    </g>
    <g class="tool-active">
      <!-- paint stroke -->
      <path class="fx" d="M32.9 8.6 C 31 7.8, 29.5 6.2, 30 4.2" stroke="var(--avatar-accent)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <circle class="fx" cx="33.9" cy="6.4" r="0.8" fill="var(--avatar-hi)"/>
      <circle class="fx fx-2" cx="35.4" cy="9" r="0.6" fill="var(--avatar-accent)"/>
    </g>
    <g class="error-badge">
      <path d="M40.5 2 L44.5 9.5 L36.5 9.5 Z" fill="none" stroke="var(--status-error)" stroke-width="1.4" stroke-linejoin="round"/>
      <line x1="40.5" y1="4.6" x2="40.5" y2="6.8" stroke="var(--status-error)" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="40.5" cy="8.2" r="0.8" fill="var(--status-error)"/>
    </g>
  </g>
</svg>
