<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="mc-avatar" data-state="idle" data-size="md" role="img" aria-label="Atlas — Scrum Master" style="--avatar-accent:#E3B341;--avatar-accent-deep:#8A6D1F;--avatar-body:#2A2E36;--avatar-deep:#1B1F26;--avatar-line:#3A414B;--avatar-hi:#E6E9ED;--avatar-paper:#E7DFCE;--avatar-faint:#8A939E;--status-error:#F85149">
  <g class="bob">
    <!-- orbit ring around the globe head -->
    <ellipse class="orbit" cx="24" cy="13" rx="13" ry="5.8" fill="none" stroke="var(--avatar-accent)" stroke-width="1.3" transform="rotate(-16 24 13)" opacity="0.85"/>
    <!-- antenna -->
    <line x1="24" y1="6.2" x2="24" y2="2.6" stroke="var(--avatar-accent)" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="24" cy="1.7" r="1.2" fill="var(--avatar-accent)"/>
    <!-- globe head -->
    <circle cx="24" cy="13" r="7.2" fill="var(--avatar-body)"/>
    <path d="M24 5.8 V20.2" stroke="var(--avatar-accent)" stroke-width="1" opacity="0.55"/>
    <path d="M16.9 13 H31.1" stroke="var(--avatar-accent)" stroke-width="1" opacity="0.3"/>
    <!-- arms -->
    <rect x="14" y="23" width="3.2" height="7.5" rx="1.6" fill="var(--avatar-deep)"/>
    <rect x="30.8" y="23" width="3.2" height="7.5" rx="1.6" fill="var(--avatar-deep)"/>
    <!-- body -->
    <rect x="18" y="22" width="12" height="12.5" rx="3" fill="var(--avatar-body)"/>
    <!-- compass chest -->
    <circle cx="24" cy="28.2" r="3.8" fill="var(--avatar-deep)"/>
    <circle cx="24" cy="28.2" r="3.8" fill="none" stroke="var(--avatar-accent)" stroke-width="1.2"/>
    <path class="needle" d="M24 25.6 L25.6 28.9 L24 28.1 L22.4 28.9 Z" fill="var(--avatar-accent)"/>
    <circle cx="24" cy="28.2" r="0.9" fill="var(--avatar-hi)"/>
    <!-- feet -->
    <rect x="20" y="34.5" width="8" height="2.2" rx="1.1" fill="var(--avatar-deep)"/>
    <g class="eyes">
      <circle cx="21.5" cy="12.2" r="1.5" fill="var(--avatar-hi)"/>
      <circle cx="26.5" cy="12.2" r="1.5" fill="var(--avatar-hi)"/>
    </g>
    <g class="eyes-error">
      <path d="M20 10.8 L23 13.8 M23 10.8 L20 13.8" stroke="var(--status-error)" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M25 10.8 L28 13.8 M28 10.8 L25 13.8" stroke="var(--status-error)" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g class="eyes-offline">
      <circle cx="21.5" cy="12.2" r="1.5" fill="var(--avatar-faint)"/>
      <circle cx="26.5" cy="12.2" r="1.5" fill="var(--avatar-faint)"/>
    </g>
    <g class="tool-active">
      <path class="fx" d="M17.6 18.5 C 15.5 17.5, 14.6 15.4, 15.4 13.4" stroke="var(--avatar-accent)" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.6"/>
      <circle class="fx fx-2" cx="15.6" cy="12.6" r="1" fill="var(--avatar-accent)"/>
    </g>
    <g class="error-badge">
      <path d="M40.5 2 L44.5 9.5 L36.5 9.5 Z" fill="none" stroke="var(--status-error)" stroke-width="1.4" stroke-linejoin="round"/>
      <line x1="40.5" y1="4.6" x2="40.5" y2="6.8" stroke="var(--status-error)" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="40.5" cy="8.2" r="0.8" fill="var(--status-error)"/>
    </g>
  </g>
</svg>
