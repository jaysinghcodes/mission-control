<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="mc-avatar" data-state="idle" data-size="md" role="img" aria-label="Sentinel — Alerts" style="--avatar-accent:#F85149;--avatar-accent-deep:#A41D1D;--avatar-body:#2A2E36;--avatar-deep:#1B1F26;--avatar-line:#3A414B;--avatar-hi:#E6E9ED;--avatar-paper:#E7DFCE;--avatar-faint:#8A939E;--status-error:#F85149">
  <g class="bob">
    <!-- radar fin (left) -->
    <rect x="15.2" y="15.5" width="2.2" height="7.5" rx="1.1" fill="var(--avatar-deep)"/>
    <line x1="16.3" y1="15.5" x2="16.3" y2="11.6" stroke="var(--avatar-deep)" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="16.3" cy="10.9" r="1.1" fill="var(--avatar-accent)"/>
    <!-- tower body -->
    <rect x="20" y="17" width="8" height="17.5" rx="2" fill="var(--avatar-body)"/>
    <!-- dome head -->
    <circle cx="24" cy="14.2" r="4.9" fill="var(--avatar-body)"/>
    <!-- beacon lamp -->
    <rect x="22.3" y="5.6" width="3.4" height="4.2" rx="1.2" fill="var(--avatar-line)"/>
    <circle class="beacon" cx="24" cy="7.7" r="1.5" fill="var(--avatar-accent)"/>
    <!-- alarm triangle chest -->
    <path d="M24 21.6 L27.2 25.8 L20.8 25.8 Z" fill="none" stroke="var(--avatar-accent)" stroke-width="1.3" stroke-linejoin="round"/>
    <circle cx="24" cy="24.4" r="0.8" fill="var(--avatar-accent)"/>
    <!-- plinth feet -->
    <rect x="17.5" y="34.5" width="13" height="2.6" rx="1.3" fill="var(--avatar-deep)"/>
    <g class="eyes">
      <circle cx="22.2" cy="13.4" r="1.4" fill="var(--avatar-hi)"/>
      <circle cx="25.8" cy="13.4" r="1.4" fill="var(--avatar-hi)"/>
    </g>
    <g class="eyes-error">
      <path d="M20.8 12 L23.6 14.8 M23.6 12 L20.8 14.8" stroke="var(--status-error)" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M24.4 12 L27.2 14.8 M27.2 12 L24.4 14.8" stroke="var(--status-error)" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g class="eyes-offline">
      <circle cx="22.2" cy="13.4" r="1.4" fill="var(--avatar-faint)"/>
      <circle cx="25.8" cy="13.4" r="1.4" fill="var(--avatar-faint)"/>
    </g>
    <g class="tool-active">
      <!-- radar sweep -->
      <g class="sweep">
        <line x1="24" y1="14.2" x2="35" y2="8.5" stroke="var(--avatar-accent)" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
        <circle cx="34.5" cy="8.8" r="0.9" fill="var(--avatar-accent)" opacity="0.8"/>
      </g>
    </g>
    <g class="error-badge">
      <path d="M40.5 2 L44.5 9.5 L36.5 9.5 Z" fill="none" stroke="var(--status-error)" stroke-width="1.4" stroke-linejoin="round"/>
      <line x1="40.5" y1="4.6" x2="40.5" y2="6.8" stroke="var(--status-error)" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="40.5" cy="8.2" r="0.8" fill="var(--status-error)"/>
    </g>
  </g>
</svg>
